<section id="contact" class="wrap section observe">
    <div class="contact">
        <div class="contact-left">
            <h3 class="splash">Let's build something together.</h3>

            <div class="social-links">
                <a class="social-card sticker-sm" href="https://www.linkedin.com/in/timvu2003" target="_blank"
                    rel="me noopener noreferrer">
                    <img src="assets/socials/linkedin.png" alt="" aria-hidden="true" />
                    <div>
                        <strong>LinkedIn</strong>
                        <p>Connect with me</p>
                    </div>
                </a>

                <a class="social-card sticker-sm" href="https://github.com/RealTimGFM" target="_blank"
                    rel="me noopener noreferrer">
                    <img src="assets/socials/git.png" alt="" aria-hidden="true" />
                    <div>
                        <strong>GitHub</strong>
                        <p>See my code</p>
                    </div>
                </a>
            </div>
        </div>

        <form id="contactForm" class="sticker-sm" novalidate>
            <label for="name">Name</label>
            <input id="name" name="name" required placeholder="Name" />

            <label for="email">Email</label>
            <input id="email" name="email" type="email" required placeholder="Email Address" />

            <label for="msg">Message</label>
            <textarea id="msg" name="message" required placeholder="Message"></textarea>

            <input type="text" name="website" class="hp" autocomplete="off" tabindex="-1" aria-hidden="true" />
            <small class="helper">Don't hesitate to contact me.</small>
            <div style="margin-top:12px"><button class="btn" type="submit">Send</button></div>
            <p id="status" style="margin-top:10px" aria-live="polite"></p>
        </form>
    </div>
</section>
